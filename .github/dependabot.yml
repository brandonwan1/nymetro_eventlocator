# Weekly pull requests that bump the pinned GitHub Actions (SHA + version comment) in .github/workflows/.
# Python dependencies are pinned in requirements*.lock (generated by scripts/lock.py); the weekly
# `newer-versions` CI job tests the newest versions, and `python scripts/lock.py --upgrade` applies them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
