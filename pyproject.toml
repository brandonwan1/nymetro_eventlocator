[project]
name = "nymetro_eventlocator"
version = "0.1.0"
description = "Personal event aggregator: finds events near you, filters them by interest, and builds a local web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "selectolax>=0.3",
    "extruct>=0.17",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "shapely>=2.0",
    "feedparser>=6.0",
    "icalendar>=5.0",
    "python-dotenv>=1.0",
    "keyring>=25",
    "platformdirs>=4",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpserver>=1.0", "freezegun>=1.5", "pytest-cov>=5", "ruff>=0.8"]
browser = ["playwright>=1.45"]

[project.scripts]
nymetro_eventlocator = "nymetro_eventlocator.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nymetro_eventlocator*"]

[tool.setuptools.package-data]
nymetro_eventlocator = ["db/migrations/*.sql", "geo/data/*.geojson", "render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nymetro_eventlocator"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 130            # only used by the formatter; line length isn't linted
extend-exclude = [".venv", "data", "output"]

[tool.ruff.lint]
# pyflakes (F), real syntax/statement problems (E4, E7, E9), likely bugs (B), outdated syntax (UP)
select = ["E4", "E7", "E9", "F", "B", "UP"]
